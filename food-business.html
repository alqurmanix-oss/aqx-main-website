<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="صفحة المطاعم ومشروعات الأكل البيتي والتموين على AQX">
<title>مطعم أو مشروع أكل بيتي | AQX</title>
<style>
:root{--purple:#7650df;--ink:#25213a;--muted:#77748a;--line:#e9e5f2;--soft:#f7f4fd}
*{box-sizing:border-box}body{margin:0;background:#fbfaff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:920px;margin:36px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 8px 26px #3020500a}
.hero{background:linear-gradient(135deg,#f4efff,#fff);padding:30px;border-radius:24px;border:1px solid var(--line)}
h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 11px;border-radius:30px;background:var(--soft);color:var(--purple);font-size:13px;margin:3px}
.btn{display:inline-block;background:var(--purple);color:#fff;text-decoration:none;border-radius:12px;padding:10px 16px;margin:6px 4px 0 0}
a{color:var(--purple)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.empty{text-align:center;padding:32px;background:white;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
</style>
</head>
<body><main>
<div id="status" class="empty">جارٍ تحميل بيانات النشاط...</div>
<section id="profile" hidden>
<header class="hero"><span id="kind" class="tag"></span><span class="tag">صفحة نشاط على AQX</span><h1 id="name"></h1><p id="description" class="muted"></p><div id="location"></div><div id="verified"></div></header>
<section class="card"><h2>بيانات النشاط</h2><div id="details" class="grid"></div></section>
<section class="card"><h2>التواصل والحجز</h2><div id="contacts"></div></section>
</section>
</main>
<script>
const ENGINE_URL='https://vuszqzgldbsscuxdfhdz.supabase.co';
const ENGINE_KEY='sb_publishable_cI7C0sL9M4OLvsa-JGAAFQ_KfqlkI7X';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
async function get(table,query){const r=await fetch(ENGINE_URL+'/rest/v1/'+table+'?'+query,{headers:{apikey:ENGINE_KEY,Accept:'application/json'}});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error('تعذر تحميل بيانات النشاط.');return d}
async function load(){
 const params=new URLSearchParams(location.search),id=params.get('id'),slug=params.get('slug');
 if(!id&&!slug)throw new Error('رابط النشاط غير مكتمل.');
 const filter=id?'id=eq.'+encodeURIComponent(id):'slug=eq.'+encodeURIComponent(slug);
 const rows=await get('aqx_directory_listings','select=id,display_name,slug,description,country_code,country_name,region,city,address,latitude,longitude,website_url,public_email,whatsapp_public,verification_status,visibility,verified_at,category_id,listing_type&'+filter+'&verification_status=eq.verified&visibility=eq.published&limit=1');
 if(!rows.length)throw new Error('النشاط غير موجود أو لم يستكمل التحقق والنشر في دليل AQX.');
 const p=rows[0],cats=await get('aqx_directory_categories','select=slug,name_i18n&id=eq.'+encodeURIComponent(p.category_id)+'&is_active=eq.true&limit=1');
 if(!cats.length||!['restaurants','home-food','catering','bakeries-pastry'].includes(cats[0].slug))throw new Error('هذه الصفحة مخصصة للمطاعم والأكل البيتي والتموين والمخابز.');
 const labels={restaurants:'مطعم', 'home-food':'مشروع أكل بيتي',catering:'تموين وولائم','bakeries-pastry':'مخبز أو حلويات'};
 $('kind').textContent=labels[cats[0].slug]||cats[0].name_i18n?.ar||'نشاط غذائي';
 $('name').textContent=p.display_name;$('description').textContent=p.description||'صفحة النشاط المنشورة في دليل AQX.';
 $('location').textContent=[p.address,p.city,p.region,p.country_name].filter(Boolean).join('، ');
 $('verified').innerHTML='<span class="tag">✓ نشاط موثق ومنشور في دليل AQX</span>';
 const details=[];
 if(p.listing_type)details.push(['نوع الإدراج',p.listing_type]);
 if(p.website_url){const u=safeUrl(p.website_url);if(u)details.push(['الموقع','<a target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">زيارة الموقع</a>']);}
 if(p.public_email)details.push(['البريد','<a href="mailto:'+esc(p.public_email)+'">'+esc(p.public_email)+'</a>']);
 if(p.latitude!==null&&p.longitude!==null)details.push(['الموقع على الخريطة','<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q='+encodeURIComponent(p.latitude+','+p.longitude)+'">فتح الخريطة</a>']);
 $('details').innerHTML=details.map(x=>'<div><b>'+esc(x[0])+'</b><div>'+x[1]+'</div></div>').join('')||'<span class="muted">لا توجد تفاصيل إضافية.</span>';
 const phones=await get('aqx_directory_phones','select=id,label,phone_e164,phone_display,phone_type,is_primary,whatsapp_enabled&listing_id=eq.'+encodeURIComponent(p.id)+'&is_public=eq.true&order=sort_order.asc');
 const contacts=[];
 if(p.whatsapp_public){const digits=String(p.whatsapp_public).replace(/[^0-9]/g,'');if(digits)contacts.push('<a class="btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+digits+'">واتساب النشاط</a>');}
 for(const ph of phones){if(ph.phone_e164){contacts.push('<a class="btn" href="tel:'+esc(ph.phone_e164)+'">'+esc(ph.label||ph.phone_display||'اتصال')+'</a>');if(ph.whatsapp_enabled){const digits=String(ph.phone_e164).replace(/[^0-9]/g,'');contacts.push('<a class="btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+digits+'">واتساب</a>');}}}
 $('contacts').innerHTML=contacts.join(' ')||'<p class="muted">لم يضف النشاط وسائل تواصل عامة حتى الآن.</p>';
 $('profile').hidden=false;$('status').hidden=true;document.title=p.display_name+' | AQX';
}
load().catch(e=>{$('status').textContent=e.message;});
</script></body></html>
