<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101827">
  <title>Alqurmanix AQX | قيد الإنشاء</title>
  <meta name="description" content="Alqurmanix AQX — منصة رقمية قيد التطوير.">
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#121e31; --text:#f4f7fb; --muted:#aab7ca; --accent:#69d2bd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top,#1b3150 0,var(--bg) 62%); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
    main { width:min(720px,100%); padding:clamp(28px,6vw,56px); border:1px solid #2b3b52; border-radius:24px; background:rgba(18,30,49,.94); box-shadow:0 24px 80px #0005; text-align:center; }
    .mark { display:inline-grid; place-items:center; width:76px; height:76px; border:1px solid #426477; border-radius:22px; color:var(--accent); font-size:27px; font-weight:800; letter-spacing:-2px; }
    h1 { margin:22px 0 8px; font-size:clamp(30px,7vw,48px); letter-spacing:-1.5px; }
    .en { direction:ltr; color:var(--accent); font-weight:700; letter-spacing:2px; }
    p { color:var(--muted); font-size:17px; line-height:1.9; margin:18px auto 0; max-width:540px; }
    .status { display:inline-flex; gap:9px; align-items:center; margin-top:28px; padding:9px 15px; border:1px solid #345c58; border-radius:999px; color:#b9eee2; font-size:14px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }
    footer { margin-top:34px; color:#77879d; font-size:12px; direction:ltr; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="AQX">AQX</div>
    <h1>القرماني إكس</h1>
    <div class="en">ALQURMANIX</div>
    <p>نعمل على تجهيز تجربة رقمية جديدة. نعود إليكم قريبًا بإطلاق منصة Alqurmanix AQX.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> الموقع قيد التجهيز</div>
    <footer>© <span id="year">2026</span> Alqurmanix AQX</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
